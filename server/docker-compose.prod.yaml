name: abhash-memory

services:
  abhash-memory:
    image: ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER}/abhash-memory:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
      - "${API_PORT:-8000}:8000"
    volumes:
      - abhash_memory_postgres:/var/lib/postgresql/data
      - abhash_memory_history:/app/history
    environment:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Dokploy environment variables}
      POSTGRES_COLLECTION_NAME: ${POSTGRES_COLLECTION_NAME:-memories}
      APP_DB_NAME: ${APP_DB_NAME:-mem0_app}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in Dokploy environment variables}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in Dokploy environment variables}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY in Dokploy environment variables}
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      DASHBOARD_URL: ${DASHBOARD_URL:-}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      NEXT_PUBLIC_INSTANCE_NAME: ${NEXT_PUBLIC_INSTANCE_NAME:-Abhash Memory}
      API_INTERNAL_URL: http://127.0.0.1:8000
      MEM0_DEFAULT_LLM_MODEL: ${MEM0_DEFAULT_LLM_MODEL:-gpt-5.4-nano}
      MEM0_DEFAULT_EMBEDDER_MODEL: ${MEM0_DEFAULT_EMBEDDER_MODEL:-text-embedding-3-small}
      MEM0_CATEGORY_LLM_MODEL: ${MEM0_CATEGORY_LLM_MODEL:-gpt-5.4-mini}
      MEM0_CATEGORY_CONFIDENCE_FLOOR: ${MEM0_CATEGORY_CONFIDENCE_FLOOR:-0.45}
      MEM0_TELEMETRY: ${MEM0_TELEMETRY:-false}
      REQUEST_LOG_RETENTION_DAYS: ${REQUEST_LOG_RETENTION_DAYS:-30}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/auth/setup-status', timeout=5).read(); urllib.request.urlopen('http://127.0.0.1:3000/api/health', timeout=5).read()\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  abhash_memory_postgres:
  abhash_memory_history:
