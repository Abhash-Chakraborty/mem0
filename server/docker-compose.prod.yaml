name: abhash-memory

services:
  mem0:
    image: ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER}/abhash-memory-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env.production
    networks:
      - abhash_memory_private
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - server_history:/app/history
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=
      - APP_DB_NAME=${APP_DB_NAME:-mem0_app}
      - AUTH_DISABLED=${AUTH_DISABLED:-false}
      - MEM0_TELEMETRY=${MEM0_TELEMETRY:-false}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/auth/setup-status', timeout=5).read()\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    shm_size: "128mb"
    networks:
      - abhash_memory_private
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -d postgres -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_db:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro

  mem0-dashboard:
    image: ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER}/abhash-memory-dashboard:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks:
      - abhash_memory_private
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in .env.production}
      - API_INTERNAL_URL=http://mem0:8000
      - NEXT_PUBLIC_INSTANCE_NAME=${NEXT_PUBLIC_INSTANCE_NAME:-Abhash Memory}
    depends_on:
      mem0:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  postgres_db:
  server_history:

networks:
  abhash_memory_private:
    driver: bridge
