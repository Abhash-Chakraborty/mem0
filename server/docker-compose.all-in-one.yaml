name: abhash-memory

services:
  abhash-memory:
    image: ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER}/abhash-memory:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-3000}:3000"
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - abhash_memory_postgres:/var/lib/postgresql/data
      - abhash_memory_history:/app/history
    environment:
      - POSTGRES_HOST=127.0.0.1
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api}
      - API_INTERNAL_URL=http://127.0.0.1:8000
      - MEM0_TELEMETRY=${MEM0_TELEMETRY:-false}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/auth/setup-status', timeout=5).read(); urllib.request.urlopen('http://127.0.0.1:3000/api/health', timeout=5).read()\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  abhash_memory_postgres:
  abhash_memory_history:
