name: Build and Deploy Abhash Memory

on:
  push:
    branches:
      - abhash-main
    paths:
      - "server/**"
      - ".github/workflows/server-deploy.yml"
      - ".github/workflows/server-ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: abhash-memory-production
  cancel-in-progress: false

jobs:
  build-push:
    name: Build and push GHCR image
    runs-on: ubuntu-latest
    outputs:
      owner_lc: ${{ steps.meta.outputs.owner_lc }}
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare image metadata
        id: meta
        run: |
          echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push all-in-one image
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/Dockerfile.all-in-one
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner_lc }}/abhash-memory:${{ steps.meta.outputs.sha_tag }}
            ghcr.io/${{ steps.meta.outputs.owner_lc }}/abhash-memory:latest

  deploy:
    name: Deploy on VPS
    runs-on: ubuntu-latest
    needs: build-push
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust VPS host
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Upload compose assets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          REMOTE_PATH="${VPS_DEPLOY_PATH:-~/abhash-memory}"
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "mkdir -p $REMOTE_PATH/server"
          scp -P "$VPS_PORT" server/docker-compose.prod.yaml "$VPS_USER@$VPS_HOST:$REMOTE_PATH/server/"

      - name: Pull and restart production stack
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          GHCR_OWNER: ${{ needs.build-push.outputs.owner_lc }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            GHCR_OWNER="$GHCR_OWNER" \
            GHCR_USERNAME="$GHCR_USERNAME" \
            GHCR_TOKEN="$GHCR_TOKEN" \
            VPS_DEPLOY_PATH="$VPS_DEPLOY_PATH" \
            'set -eu
             VPS_DEPLOY_PATH="${VPS_DEPLOY_PATH:-$HOME/abhash-memory}"
             cd "$VPS_DEPLOY_PATH/server"
             echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
             export GHCR_OWNER IMAGE_TAG=latest
             docker compose --env-file .env.production -f docker-compose.prod.yaml pull
             docker compose --env-file .env.production -f docker-compose.prod.yaml up -d
             docker compose --env-file .env.production -f docker-compose.prod.yaml ps
             docker compose --env-file .env.production -f docker-compose.prod.yaml exec -T abhash-memory python -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/auth/setup-status\", timeout=10).read(); urllib.request.urlopen(\"http://127.0.0.1:3000/api/health\", timeout=10).read()"'
