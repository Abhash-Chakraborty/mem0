name: Build and Deploy Abhash Memory

on:
  push:
    branches:
      - abhash-main
    paths:
      - "server/**"
      - ".github/workflows/server-deploy.yml"
      - ".github/workflows/server-ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: abhash-memory-production
  cancel-in-progress: false

jobs:
  build-push:
    name: Build and push GHCR image
    runs-on: ubuntu-latest
    outputs:
      owner_lc: ${{ steps.meta.outputs.owner_lc }}
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare image metadata
        id: meta
        run: |
          echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push all-in-one image
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/Dockerfile.all-in-one
          push: true
          platforms: linux/amd64,linux/arm64
          # GitHub Actions layer cache. The arm64 leg compiles pgvector under
          # QEMU, which is slow; caching unchanged layers across runs avoids
          # recompiling it every push.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner_lc }}/abhash-memory:${{ steps.meta.outputs.sha_tag }}
            ghcr.io/${{ steps.meta.outputs.owner_lc }}/abhash-memory:latest

  deploy:
    name: Trigger Dokploy deploy
    runs-on: ubuntu-latest
    needs: build-push
    environment: production
    steps:
      - name: Call Dokploy webhook
        env:
          DOKPLOY_DEPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DOKPLOY_DEPLOY_WEBHOOK_URL}" ]; then
            echo "::error::Set the DOKPLOY_DEPLOY_WEBHOOK_URL repository secret to your Dokploy webhook URL."
            exit 1
          fi
          curl --fail --show-error --silent --request POST "${DOKPLOY_DEPLOY_WEBHOOK_URL}"
