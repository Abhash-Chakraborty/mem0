name: Abhash Memory CI

on:
  pull_request:
    branches:
      - staging
      - abhash-main
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"
      - ".github/workflows/server-deploy.yml"
  push:
    branches:
      - staging
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"
      - ".github/workflows/server-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abhash-memory-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API smoke and Docker build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      JWT_SECRET: ci-secret-at-least-sixteen-characters
      AUTH_DISABLED: "false"
      POSTGRES_PASSWORD: ci-postgres-password
      OPENAI_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install API dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Check API syntax and support imports
        run: |
          python -m py_compile *.py routers/*.py scripts/*.py
          python -c "import auth, db, models; print('api support modules ok')"

      - name: Run API tests
        run: pytest

      - name: Build API image
        run: docker build -t abhash-memory-api:test .

      - name: Build all-in-one image
        run: docker build -f Dockerfile.all-in-one -t abhash-memory:test .

  dashboard:
    name: Dashboard typecheck, build, and Docker build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: server/dashboard/pnpm-lock.yaml

      - name: Install dashboard dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck dashboard
        run: pnpm run typecheck

      - name: Build dashboard
        run: pnpm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8888
          NEXT_PUBLIC_INSTANCE_NAME: Abhash Memory

      - name: Build dashboard image
        run: docker build -t abhash-memory-dashboard:test .
