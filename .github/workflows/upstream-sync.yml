name: Upstream Sync

# Keeps this fork in sync with upstream mem0ai/mem0.
#
# It MERGES upstream/main into a fresh staging/upstream-sync-<date> branch
# created off BASE_BRANCH, then opens a PR back into BASE_BRANCH. Merge (not
# rebase) is used so the fork's published history is never rewritten.
#
# Three mechanisms keep recurring conflicts from biting every week:
#   1. git rerere  - replays previously recorded conflict resolutions. The cache
#                    is committed at .github/sync/rr-cache so CI reuses the same
#                    resolutions you made locally.
#   2. prune step  - re-applies the fork's intentional deletions listed in
#                    .github/sync/removed-paths.txt, so files/folders the fork
#                    removed do not reappear when upstream edits them.
#   3. draft PR    - anything still conflicting is committed WITH markers and
#                    surfaced in a draft PR for manual resolution. Nothing is
#                    ever silently auto-resolved the wrong way.
#
# IMPORTANT operational requirements (these are why the old setup never ran):
#   * schedule/workflow_dispatch only fire from the workflow file on the repo's
#     DEFAULT branch. This file must live on the default branch (set the repo
#     default branch to `abhash-main`, or copy this workflow onto `main`).
#   * Settings > Actions > General > "Allow GitHub Actions to create and approve
#     pull requests" must be ENABLED, or `gh pr create` below cannot open the PR.

on:
  schedule:
    # Mondays at 04:17 UTC (off the :00 mark to avoid the scheduler stampede).
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      base_branch:
        description: "Branch to sync upstream into"
        required: true
        default: "abhash-main"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/mem0ai/mem0.git
  UPSTREAM_BRANCH: main
  # Default target for scheduled runs; overridden by the workflow_dispatch input.
  BASE_BRANCH: ${{ github.event.inputs.base_branch || 'abhash-main' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork (full history)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity and merge behaviour
        run: |
          git config user.name "abhash-upstream-sync[bot]"
          git config user.email "actions@github.com"
          # Replay previously recorded conflict resolutions.
          git config rerere.enabled true
          git config rerere.autoupdate true
          # Better rename detection so relocated files merge instead of duplicating.
          git config merge.renamelimit 999999
          git config diff.renames copies
          # Seed rerere with the resolutions committed in the repo.
          mkdir -p .git/rr-cache
          if [ -d .github/sync/rr-cache ]; then
            cp -a .github/sync/rr-cache/. .git/rr-cache/ || true
          fi

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM_REPO" || git remote set-url upstream "$UPSTREAM_REPO"
          git fetch upstream "$UPSTREAM_BRANCH"

      - name: Merge upstream and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          DATE="$(date +%Y%m%d)"
          BRANCH="staging/upstream-sync-${DATE}"

          AHEAD="$(git rev-list --count ${BASE_BRANCH}..upstream/${UPSTREAM_BRANCH})"
          if [ "$AHEAD" = "0" ]; then
            echo "No new upstream commits. Nothing to sync."
            exit 0
          fi
          echo "Upstream is $AHEAD commit(s) ahead of ${BASE_BRANCH}."

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists on origin; skipping."
            exit 0
          fi

          git checkout -b "$BRANCH" "${BASE_BRANCH}"

          # Merge upstream. Do not fail the step on conflicts; we handle them below.
          set +e
          git merge --no-edit --no-ff "upstream/${UPSTREAM_BRANCH}"
          set -e

          # Re-apply the fork's intentional deletions so removed paths never creep back.
          if [ -f .github/sync/removed-paths.txt ]; then
            grep -vE '^[[:space:]]*(#|$)' .github/sync/removed-paths.txt | while read -r p; do
              [ -n "$p" ] && git rm -rq --ignore-unmatch -- "$p" || true
            done
          fi

          # Persist any conflict resolutions rerere learned this run back into the repo.
          mkdir -p .github/sync/rr-cache
          cp -a .git/rr-cache/. .github/sync/rr-cache/ 2>/dev/null || true
          git add .github/sync/rr-cache 2>/dev/null || true

          CONFLICTS="$(git diff --name-only --diff-filter=U || true)"

          if [ -z "$CONFLICTS" ]; then
            echo "No remaining conflicts (auto-resolved by rerere/prune)."
            git commit --no-edit || true
            git push origin "$BRANCH"
            gh pr create \
              --base "${BASE_BRANCH}" \
              --head "$BRANCH" \
              --title "sync upstream ${DATE}" \
              --body "Automated upstream sync. Merged \`upstream/${UPSTREAM_BRANCH}\` into \`${BASE_BRANCH}\` (${AHEAD} upstream commit(s)). Conflicts auto-resolved via rerere + prune. CI must pass before merge." \
              || echo "::warning::Branch '$BRANCH' pushed, but PR creation failed (check 'Allow GitHub Actions to create and approve pull requests'). Open manually: https://github.com/${GITHUB_REPOSITORY}/pull/new/$BRANCH"
            exit 0
          fi

          echo "::warning::Unresolved conflicts remain; opening a draft PR with markers committed."
          git add -A
          git commit -m "merge upstream ${DATE} (CONFLICTS - manual resolution required) [skip ci]"
          git push origin "$BRANCH"

          BODY_FILE="$(mktemp)"
          {
            echo "Automated upstream sync hit conflicts that rerere/prune could not resolve."
            echo ""
            echo "This DRAFT PR merges \`upstream/${UPSTREAM_BRANCH}\` into \`${BASE_BRANCH}\` with **conflict markers committed**. Resolve them locally, then push:"
            echo ""
            echo '```bash'
            echo "git fetch origin && git checkout ${BRANCH}"
            echo "git config rerere.enabled true   # record your resolution for next time"
            echo "# edit files to remove <<<<<<< / ======= / >>>>>>> markers, then:"
            echo "git add -A && git commit && git push"
            echo "# commit the new .github/sync/rr-cache so CI learns this resolution too"
            echo '```'
            echo ""
            echo "> CI is skipped on this conflict snapshot. After resolving, push a normal commit to run CI."
            echo ""
            echo "### Conflicted files"
            echo "$CONFLICTS" | sed 's/^/- `/; s/$/`/'
          } > "$BODY_FILE"

          gh pr create \
            --base "${BASE_BRANCH}" \
            --head "$BRANCH" \
            --title "sync upstream ${DATE} (conflicts)" \
            --body-file "$BODY_FILE" \
            --draft \
            || echo "::warning::Conflict branch '$BRANCH' pushed, but draft PR creation failed. Open manually: https://github.com/${GITHUB_REPOSITORY}/pull/new/$BRANCH"
